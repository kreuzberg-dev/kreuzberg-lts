"crates/kreuzberg-node/typescript/cli.ts" = ["no-console"]
"crates/kreuzberg-wasm/scripts/copy-pkg.js" = ["no-console"]
"crates/kreuzberg-wasm/scripts/fix-type-exports.js" = ["no-console"]
"crates/kreuzberg-wasm/scripts/fix-wasi-imports.js" = ["no-console"]
"docker/**" = ["DL3006", "DL3059"]
"e2e/**/*.py" = ["A001", "N801"]
# CI smoke-test helper script; console output is its diagnostic product. ~keep
"github/actions/smoke-node/update-package-spec.js" = ["no-console"]
"packages/python/build.py" = ["INP001"]
"packages/r/tools/*.py" = ["ANN201", "B023", "C901", "D415", "EXE001", "PLR0912", "PLR0915", "PTH123", "T201"]
"packages/php/src/Plugins/ValidatorRegistry.php" = ["no-empty-catch-clause"]
"scripts/**/*.py" = [
  "ANN201",
  "ANN204",
  "B904",
  "B023",
  "C901",
  "D101",
  "D102",
  "D103",
  "D415",
  "E702",
  "ERA001",
  "EXE001",
  "EXE002",
  "G004",
  "G201",
  "INP001",
  "PERF203",
  "PERF401",
  "PLC0415",
  "PLR0912",
  "PLR0915",
  "PLW0108",
  "PLW1510",
  "PLW2901",
  "PT018",
  "PTH108",
  "PTH123",
  "S101",
  "S108",
  "S311",
  "S607",
  "S701",
  "SIM105",
  "SIM108",
  "SIM115",
  "T201",
]
"scripts/ci/docker/test_docker.py" = ["EXE001"]

