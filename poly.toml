# --- end quality-debt baseline ---
# Worker-channel postMessage only. `Worker.postMessage`, `parentPort.postMessage`
# (node:worker_threads) and `DedicatedWorkerGlobalScope.postMessage` take no targetOrigin
# argument -- only `window.postMessage` does, and none of these are that. Verified at every
# call site; no "*" origin appears anywhere. The rule stays ON everywhere else, where it
# guards a real cross-origin leak. ~keep
"crates/kreuzberg-wasm/typescript/ocr/ocr-worker.ts" = ["unicorn/require-post-message-target-origin"]
"crates/kreuzberg-wasm/typescript/ocr/worker-bridge.ts" = ["unicorn/require-post-message-target-origin"]
"packages/typescript/tests/worker-lifecycle.spec.ts" = ["unicorn/require-post-message-target-origin"]
"packages/typescript/tests/worker-threading.spec.ts" = ["unicorn/require-post-message-target-origin"]
# `console` is the logging surface in these three groups, and neither the node nor the wasm
# TypeScript package contains a logger to route through -- kreuzberg-wasm declares no runtime
# dependencies at all, so satisfying the rule would mean adding one to a zero-dependency
# browser package. The rule stays ON everywhere else. ~keep
#   1. A GitHub Actions step script. `console.error` then `process.exit(1)` IS how a CI step
#      reports; there is no other channel.
".github/actions/smoke-node/update-package-spec.js" = ["no-console"]
#   2. The `KREUZBERG_DEBUG_OCR` trace. Not leftover debugging: the variable is documented in
#      docs-site/src/content/docs/reference/environment-variables.md, read by the Rust core in
#      crates/kreuzberg/src/extractors/pdf/mod.rs, and exercised by
#      crates/kreuzberg-node/tests/binding/ocr-backend.spec.ts. Every site is behind the gate.
"crates/kreuzberg-node/typescript/extraction/single.ts" = ["no-console"]
"crates/kreuzberg-node/typescript/plugins/ocr-backends.ts" = ["no-console"]
#   3. Genuine WARN-level events a consumer must see: a plugin registration silently
#      overwriting an earlier one, a swallowed `shutdown()` error, PDFium failing to
#      initialise so PDF extraction degrades. Deleting these swallows the error outright.
"crates/kreuzberg-wasm/src/pdfium_init.js" = ["no-console"]
"crates/kreuzberg-wasm/typescript/initialization/pdfium-loader.ts" = ["no-console"]
"crates/kreuzberg-wasm/typescript/initialization/wasm-loader.ts" = ["no-console"]
"crates/kreuzberg-wasm/typescript/ocr/registry.ts" = ["no-console"]
#      Glob, not a literal path: the quality-debt baseline above already keys this file for
#      `type-too-long`, and a repeated literal key makes the whole config fail to parse. The
#      pattern matches exactly one file in the repo. ~keep
"**/tesseract-wasm-backend.ts" = ["no-console"]
"crates/kreuzberg-wasm/typescript/plugin-registry.ts" = ["no-console"]
# Quality metrics do not apply to test code. A test function's length is its assertion
# count and a table-driven test's arity mirrors its cases; splitting either to satisfy a
# production-code maintainability metric makes the test harder to read, not easier. Only
# `file-too-long` and `type-too-long` still apply here -- an oversized test FILE is a real
# organisational problem, unlike an oversized test function. ~keep
"**/test/**/*" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
